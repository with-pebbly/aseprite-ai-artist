# OpenAI Codex CLI — ~/.codex/config.toml (or .codex/config.toml in a trusted project).
# Codex reads TOML; the JSON that Claude Code and Cursor use will not work here.
#
# Written for you by:  npx @pebbly/aseprite-ai-artist install codex

[mcp_servers.aseprite-ai-artist]
command = "npx"
args = ["-y", "@pebbly/aseprite-ai-artist@latest", "serve"]

# Optional: point at a non-default Aseprite, or move the ports.
# [mcp_servers.aseprite-ai-artist.env]
# ASEPRITE_AI_PLUGIN_PORT = "9931"
# ASEPRITE_AI_CONTROL_PORT = "9932"
